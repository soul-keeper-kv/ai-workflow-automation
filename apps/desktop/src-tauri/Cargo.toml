[package]
name = "ai-automation-platform"
version = "0.1.0"
description = "Desktop shell for the AI Automation Platform"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
# The `_lib` suffix avoids a name clash with the binary on Windows (cargo issue #8519).
name = "ai_automation_platform_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
tauri = { version = "2.12.4" }
